<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>График смен</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#18202b;--mut:#667085;--line:#d9dee6;--acc:#1f5eff;--accd:#e8efff;--bad:#c62828;--badbg:#fdecec;--wk:#f7f1ea;--ok:#1b7a43}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--card:#19212b;--ink:#e8edf3;--mut:#93a0b3;--line:#2c3744;--acc:#6d98ff;--accd:#1d2a47;--bad:#ff8a80;--badbg:#3a1f1f;--wk:#21262e;--ok:#6fd49b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 12px;position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
label{font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center}
input,select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:36px}
input[type=number]{width:64px}input[type=time]{width:100px}input.nm{width:130px}
button{cursor:pointer}button.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.x{color:var(--bad);padding:6px 10px}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.tabs button{border-radius:8px 8px 0 0;border-bottom:0}.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{padding:12px;max-width:1100px;margin:auto}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px}
summary{cursor:pointer;font-weight:600}
.sec{margin:10px 0;display:grid;gap:6px}.sec h3{margin:6px 0 0;font-size:14px}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top;white-space:nowrap}
th{background:var(--accd);font-size:13px;position:sticky;top:0}
tr.we td{background:var(--wk)}
td.d{font-weight:600;min-width:62px}td.d small{color:var(--mut);font-weight:400}
td select{display:block;width:100%;min-width:120px;margin:2px 0}
td select.empty{border-color:var(--bad);background:var(--badbg)}
.msg{position:fixed;left:12px;right:12px;bottom:12px;max-width:560px;margin:auto;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;display:none;z-index:9}
.hint{color:var(--mut);font-size:13px;margin:4px 0 10px}
@media print{header .row,details,.hint,.msg,.tabs{display:none}header{position:static}td select{border:0;background:none;appearance:none;padding:0;min-height:0}}
</style></head><body>
<header>
<h1>График смен</h1>
<div class="row">
 <label>Месяц <input type="month" id="mon" onchange="S.month=this.value;go()"></label>
 <label>Отдых между сменами, мин <input type="number" id="gap" min="0" step="15" onchange="S.gap=+this.value||0;go()"></label>
 <label>Макс. дней подряд <input type="number" id="run" min="1" max="31" onchange="S.maxRun=+this.value||6;go()"></label>
 <label><input type="checkbox" id="one" style="min-height:0" onchange="S.oneDay=this.checked;go()"> один день — одна работа</label>
</div>
<div class="row tabs" id="tabs" style="margin-top:8px"></div>
</header>
<main id="app"></main>
<div class="msg" id="msg"></div>
<input type="file" id="imp" accept=".json" hidden>
<script>
const KEY='shiftplan_v1';
const mk=(n,sh)=>({name:n,shifts:sh.map(x=>({n:x[0],s:x[1],e:x[2],need:x[3],rate:0})),emps:[],sched:{}});
const def=()=>({gap:60,maxRun:6,month:new Date().toISOString().slice(0,7),cur:0,wp:[mk('Работа 1',[['1 смена','06:00','14:30',1],['2 смена','14:30','23:00',1]]),mk('Работа 2',[['Смена','10:00','22:00',1]])]});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.wp)S=def();
let openCfg=true;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const tm=t=>{const[a,b]=(t||'0:0').split(':');return+a*60+ +b};
const ivl=(d,sh)=>{const b=Date.parse(d+'T00:00:00Z')/6e4;let s=b+tm(sh.s),e=b+tm(sh.e);if(e<=s)e+=1440;return[s,e]};
const clash=(a,b)=>a[0]<b[1]+S.gap&&b[0]<a[1]+S.gap;
const days=()=>{const[y,m]=S.month.split('-').map(Number);return Array.from({length:new Date(y,m,0).getDate()},(_,i)=>`${S.month}-${String(i+1).padStart(2,'0')}`)};
const dow=d=>new Date(d+'T00:00:00Z').getUTCDay();
const hrs=sh=>{let m=tm(sh.e)-tm(sh.s);if(m<=0)m+=1440;return m/60};
function parseOff(t){const s=new Set();String(t||'').split(/[,; ]+/).forEach(p=>{const m=p.match(/^(\d+)(?:-(\d+))?$/);if(m)for(let i=+m[1];i<=+(m[2]||m[1]);i++)s.add(i)});return s}
function toast(t){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',5000)}
function go(){save();render()}

// занят ли человек в другой смене (в обеих работах)
function busy(name,w,date,si,k){
 const me=ivl(date,S.wp[w].shifts[si]);let r=null;
 S.wp.forEach((W,j)=>{for(const key in W.sched){
  const[d,i]=key.split('|');
  if(Math.abs(Date.parse(d)-Date.parse(date))>2*864e5)continue;
  const sh=W.shifts[i];if(!sh)continue;
  W.sched[key].forEach((n,idx)=>{
   if(n!==name||(j===w&&key===date+'|'+si&&idx===k))return;
   if(clash(me,ivl(d,sh))||(S.oneDay!==false&&d===date))r=`${W.name} ${d.slice(8)}.${d.slice(5,7)} ${sh.s}–${sh.e}`;
  })}});
 return r}

function setCell(w,date,si,k,v){const W=S.wp[w],key=date+'|'+si,a=W.sched[key]||(W.sched[key]=[]);a[k]=v;go()}
function setWp(f,v){S.wp[S.cur][f]=v;go()}
function setSh(i,f,v){S.wp[S.cur].shifts[i][f]=f==='need'?Math.max(1,+v||1):f==='rate'?Math.max(0,+v||0):v;go()}
function addSh(){S.wp[S.cur].shifts.push({n:'Смена',s:'09:00',e:'18:00',need:1,rate:0});go()}
function delSh(i){if(confirm('Удалить смену? Внесённые в неё имена пропадут.')){const W=S.wp[S.cur];W.shifts.splice(i,1);W.sched={};go()}}
function setEmp(i,f,v){const E=S.wp[S.cur].emps[i];
 if(f==='n'){v=v.trim();const old=E.n;S.wp.forEach(W=>{for(const k in W.sched)W.sched[k]=W.sched[k].map(n=>n===old&&old?v:n)})}
 E[f]=f==='t'?Math.max(0,+v||0):v;go()}
function addEmp(){S.wp[S.cur].emps.push({n:'',t:0,off:''});go()}
function delEmp(i){S.wp[S.cur].emps.splice(i,1);go()}
function clearMonth(){if(!confirm('Очистить график этой работы за месяц?'))return;const W=S.wp[S.cur],ds=new Set(days());for(const k in W.sched)if(ds.has(k.split('|')[0]))delete W.sched[k];go()}

// ---------- авто-составление ----------
function gen(){
 const w=S.cur,W=S.wp[w],ds=days(),keep=$('#keep').checked,mset=new Set(ds);
 const oth=S.wp[1-w],emps=W.emps.filter(e=>e.n.trim()).map(e=>{if(!e.all)return e;const u=new Set();for(const key in oth.sched){const d=key.split('|')[0];if(mset.has(d)&&oth.sched[key].includes(e.n.trim()))u.add(d)}return{...e,t:ds.length-u.size}});
 if(!emps.length)return toast('Сначала добавьте сотрудников в настройках');
 const offs={};emps.forEach(e=>offs[e.n]=parseOff(e.off));
 let best=null,bs=1e18,bm=0;
 for(let it=0;it<400;it++){
  const sc=[{},{}],ix={},dy={},cnt={};emps.forEach(e=>cnt[e.n]=0);
  const add=(n,d,sh)=>{(ix[n]=ix[n]||[]).push(ivl(d,sh));(dy[n]=dy[n]||new Set()).add(Math.round(Date.parse(d)/864e5))};
  S.wp.forEach((X,j)=>{for(const key in X.sched){
   const[d,i]=key.split('|'),sh=X.shifts[i];if(!sh)continue;
   const inM=mset.has(d);if(j===w&&inM&&!keep)continue;
   const arr=X.sched[key].slice();sc[j][key]=arr;
   arr.forEach(n=>{if(n){add(n,d,sh);if(j===w&&inM&&n in cnt)cnt[n]++}})}});
  let miss=0;
  ds.forEach(d=>{const dn=Math.round(Date.parse(d)/864e5),dom=+d.slice(8);
   W.shifts.forEach((sh,si)=>{
    const arr=sc[w][d+'|'+si]=sc[w][d+'|'+si]||[],me=ivl(d,sh);
    for(let k=0;k<sh.need;k++){
     if(arr[k])continue;let bc=null,bv=-1e9;
     for(const e of emps){const n=e.n;
      if(offs[n].has(dom)||arr.includes(n))continue;
      if((ix[n]||[]).some(x=>clash(me,x)))continue;
      const D=dy[n]||new Set();let r=1,a=dn-1,b=dn+1;while(D.has(a)){r++;a--}while(D.has(b)){r++;b++}
      if(r>S.maxRun||(S.oneDay!==false&&D.has(dn)))continue;
      let v=(e.t>0?e.t:0)-cnt[n]+Math.random()*1.5;
      if(e.t>0&&cnt[n]>=e.t)v-=50;
      if(D.has(dn-1))v-=.8;
      if(v>bv){bv=v;bc=n}}
     if(bc){arr[k]=bc;add(bc,d,sh);cnt[bc]++}else{arr[k]='';miss++}}
    for(let k=0;k<sh.need;k++)if(!arr[k])arr[k]='';
   })});
  const c=emps.map(e=>cnt[e.n]);
  let s=miss*1000+(Math.max(...c)-Math.min(...c))*2;
  emps.forEach(e=>{if(e.t>0)s+=Math.abs(cnt[e.n]-e.t)*10});
  if(s<bs){bs=s;best=sc[w];bm=miss}
  if(s===0)break}
 W.sched=best;go();
 toast(bm?`Не удалось закрыть мест: ${bm}. Добавьте сотрудников или уменьшите ограничения.`:'График составлен. Проверьте и поправьте вручную, если нужно.')}

// ---------- вывод ----------
function render(){
 $('#mon').value=S.month;$('#gap').value=S.gap;$('#run').value=S.maxRun;$('#one').checked=S.oneDay!==false;
 $('#tabs').innerHTML=S.wp.map((W,i)=>`<button class="${i===S.cur?'on':''}" onclick="S.cur=${i};go()">${esc(W.name)}</button>`).join('');
 const w=S.cur,W=S.wp[w],ds=days(),names=[...new Set(W.emps.map(e=>e.n.trim()).filter(Boolean))];
 let h=`<details ${openCfg?'open':''} ontoggle="openCfg=this.open"><summary>Настройки: смены и сотрудники</summary>
 <div class="sec"><label>Название работы <input value="${esc(W.name)}" onchange="setWp('name',this.value)"></label>
 <h3>Смены в день</h3>`+
 W.shifts.map((s,i)=>`<div class="row"><input class="nm" value="${esc(s.n)}" onchange="setSh(${i},'n',this.value)" aria-label="Название">
 <input type="time" value="${s.s}" onchange="setSh(${i},'s',this.value)" aria-label="Начало"> —
 <input type="time" value="${s.e}" onchange="setSh(${i},'e',this.value)" aria-label="Конец">
 <label>человек <input type="number" min="1" value="${s.need}" onchange="setSh(${i},'need',this.value)"></label>
 <label>ставка за смену <input type="number" min="0" step="500" style="width:100px" value="${s.rate||0}" onchange="setSh(${i},'rate',this.value)"></label>
 <button class="x" onclick="delSh(${i})" title="Удалить">✕</button></div>`).join('')+
 `<div><button onclick="addSh()">+ Добавить смену</button></div>
 <h3>Сотрудники</h3>
 <div class="hint">Если вы работаете в обеих местах — впишите себя с одним и тем же именем в обеих работах. Тогда пересекающиеся смены будут блокироваться. «Смен за месяц» — желаемое число (0 — без цели). Галочка «все дни, свободные на другой работе» сама ставит цель: все дни месяца, когда вы не заняты на другой работе (сначала составьте график той работы). «Выходные» — числа месяца, например 3, 10-12.</div>`+
 W.emps.map((e,i)=>`<div class="row"><input class="nm" placeholder="Имя" value="${esc(e.n)}" onchange="setEmp(${i},'n',this.value)">
 <label>смен за месяц <input type="number" min="0" value="${e.t}" onchange="setEmp(${i},'t',this.value)"></label>
 <label>выходные <input class="nm" value="${esc(e.off)}" onchange="setEmp(${i},'off',this.value)"></label>
 <label><input type="checkbox" style="min-height:0" ${e.all?'checked':''} onchange="setEmp(${i},'all',this.checked)"> все дни, свободные на другой работе</label>
 <button class="x" onclick="delEmp(${i})" title="Удалить">✕</button></div>`).join('')+
 `<div><button onclick="addEmp()">+ Добавить сотрудника</button></div></div></details>
 <div class="row" style="margin-bottom:10px"><button class="p" onclick="gen()">Составить график</button>
 <label><input type="checkbox" id="keep" checked style="min-height:0"> сохранять уже внесённое</label>
 <button onclick="clearMonth()">Очистить месяц</button><button onclick="window.print()">Печать</button><button onclick="png()">Скачать PNG</button>
 <button onclick="exp()">Сохранить копию</button><button onclick="$('#imp').click()">Загрузить копию</button></div>
 <div class="hint">Занятые в другой работе или в выходной имена в списках отключены и помечены ⛔. Красная ячейка — место не закрыто.</div>
 <div class="wrap"><table><thead><tr><th>День</th>${W.shifts.map(s=>`<th>${esc(s.n)}<br><small>${s.s}–${s.e}</small></th>`).join('')}</tr></thead><tbody>`;
 const offs={};W.emps.forEach(e=>offs[e.n]=parseOff(e.off));
 ds.forEach(d=>{const wd=dow(d),dom=+d.slice(8);
  h+=`<tr class="${wd==0||wd==6?'we':''}"><td class="d">${dom} <small>${WD[wd]}</small></td>`;
  W.shifts.forEach((sh,si)=>{h+='<td>';const cur=W.sched[d+'|'+si]||[];
   for(let k=0;k<sh.need;k++){const v=cur[k]||'';
    h+=`<select class="${v?'':'empty'}" onchange="setCell(${w},'${d}',${si},${k},this.value)"><option value="">—</option>`+
    [...new Set([...names,...(v&&!names.includes(v)?[v]:[])])].map(n=>{
     if(n===v)return`<option selected>${esc(n)}</option>`;
     const b=busy(n,w,d,si,k),o=offs[n]&&offs[n].has(dom);
     return b?`<option disabled>⛔ ${esc(n)} — ${esc(b)}</option>`:o?`<option disabled>⛔ ${esc(n)} — выходной</option>`:`<option>${esc(n)}</option>`}).join('')+'</select>'}
   h+='</td>'});
  h+='</tr>'});
 h+='</tbody></table></div>';
 // итоги
 const rows=names.map(n=>{const r=stats(n,w,ds),e=W.emps.find(x=>x.n.trim()===n);return`<tr><td>${esc(n)}</td><td>${r.c}</td><td>${+r.t.toFixed(1)}</td><td>${e.t||'—'}</td><td>${fmt(r.m)}</td><td>${r.o}</td><td>${fmt(r.m+r.mo)}</td></tr>`}).join('');
 h+=`<div class="wrap"><table><thead><tr><th>Сотрудник</th><th>Смен</th><th>Часов</th><th>Цель</th><th>Сумма</th><th>Смен в др. работе</th><th>Итого с двух работ</th></tr></thead><tbody>${rows||'<tr><td colspan=7>Добавьте сотрудников</td></tr>'}</tbody></table></div>`;
 $('#app').innerHTML=h}

const fmt=x=>Math.round(x).toLocaleString('ru-RU');
function stats(n,w,ds){const dsS=new Set(ds);const r={c:0,t:0,o:0,m:0,mo:0};
 S.wp.forEach((X,j)=>{for(const key in X.sched){const[d,i]=key.split('|'),sh=X.shifts[i];if(!dsS.has(d)||!sh)continue;
  const q=X.sched[key].filter(x=>x===n).length;if(!q)continue;const m=q*(+sh.rate||0);
  if(j===w){r.c+=q;r.t+=q*hrs(sh);r.m+=m}else{r.o+=q;r.mo+=m}}});return r}

function png(){
 const w=S.cur,W=S.wp[w],ds=days(),k=2,pad=20,rh=34,F='system-ui,Arial,sans-serif';
 const cw=[100,...W.shifts.map(()=>Math.max(230,Math.ceil(460/W.shifts.length)))],tw=cw.reduce((a,b)=>a+b,0);
 const names=[...new Set(W.emps.map(e=>e.n.trim()).filter(Boolean))];
 const H=pad*2+46+rh*(ds.length+1)+(names.length?30+rh*(names.length+1):0);
 const cv=document.createElement('canvas');cv.width=(tw+pad*2)*k;cv.height=H*k;
 const c=cv.getContext('2d');c.scale(k,k);c.fillStyle='#fff';c.fillRect(0,0,tw+pad*2,H);c.textBaseline='middle';
 const txt=(t,x,y,wd,sz,bold,col)=>{let z=sz;do{c.font=(bold?'600 ':'')+z+'px '+F;z--}while(c.measureText(t).width>wd-12&&z>8);c.fillStyle=col||'#18202b';c.fillText(t,x+6,y)};
 const [yy,mm]=S.month.split('-').map(Number);
 txt(W.name+' — '+new Date(yy,mm-1,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'}),pad,pad+16,tw,22,true);
 let y=pad+46;
 const row=(cells,widths,bg,bold,fills)=>{let x=pad;if(bg){c.fillStyle=bg;c.fillRect(pad,y,tw,rh)}
  cells.forEach((t,i)=>{if(fills&&fills[i]){c.fillStyle=fills[i];c.fillRect(x,y,widths[i],rh)}txt(t,x,y+rh/2,widths[i],15,bold);x+=widths[i]});
  c.fillStyle='#d9dee6';c.fillRect(pad,y+rh-1,tw,1);y+=rh};
 row(['День',...W.shifts.map(s=>`${s.n} ${s.s}–${s.e}`)],cw,'#e8efff',true);
 ds.forEach(d=>{const wd=dow(d);
  const cells=W.shifts.map((sh,si)=>{const a=(W.sched[d+'|'+si]||[]).filter(Boolean);return a.length?a.join(', '):'—'});
  const fills=['',...W.shifts.map((sh,si)=>{const a=(W.sched[d+'|'+si]||[]).filter(Boolean);return a.length<sh.need?'#fdecec':''})];
  row([+d.slice(8)+' '+WD[wd],...cells],cw,wd==0||wd==6?'#f7f1ea':null,false,fills)});
 if(names.length){y+=30;const sw=[Math.max(200,tw-420),80,100,140];
  row(['Сотрудник','Смен','Часов','Сумма'],sw,'#e8efff',true);
  names.forEach(n=>{const r=stats(n,w,ds);row([n,String(r.c),String(+r.t.toFixed(1)),fmt(r.m)],sw)})}
 cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='grafik-'+W.name.replace(/\s+/g,'_')+'-'+S.month+'.png';a.click()});
}

function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='grafik-smen-'+S.month+'.json';a.click()}
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.wp)throw 0;S=x;go();toast('Копия загружена')}catch(_){toast('Не удалось прочитать файл')}};r.readAsText(f)};
render();
</script></body></html>
